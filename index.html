<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#64258F">
    <meta name="description" content="DIVAS — salão de beleza em Cachoeirinha/RS. Especialistas em cabelos, unhas, sobrancelhas e estética. Agende seu horário com nossa Assistente Virtual.">
    <title>DIVAS | Salão de Beleza | Cachoeirinha - RS</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --lilac: #B99AE8;
            --deep: #64258F;
            --deep-dark: #461768;
            --ink: #292333;
            --muted: #746d7d;
            --pale: #F7F1FC;
            --white: #fff;
            --line: #E8DDF2;
            --gold: #D4AF37;
            --gold-light: #F7EBC5;
            --shadow: 0 18px 55px rgba(77,35,111,.15);
            --font-heading: "Playfair Display", serif;
            --font-body: "DM Sans", sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--white); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5; overflow-x: hidden; }
        a { color: inherit; text-decoration: none; transition: color .3s ease; }
        ul { list-style: none; }
        button, input, select, textarea { font: inherit; }
        
        .container { width: min(1200px, 92%); margin: auto; }
        .section { padding: 80px 0; }
        .section-head { text-align: center; max-width: 680px; margin: 0 auto 60px; }
        .kicker { color: var(--deep); font-size: 12px; letter-spacing: 3px; font-weight: 700; text-transform: uppercase; display: block; margin-bottom: 8px; }
        .section-title { font: 600 clamp(36px, 4vw, 52px)/1.15 var(--font-heading); color: var(--ink); margin-bottom: 15px; }
        .section-lead { color: var(--muted); font-size: 18px; line-height: 1.8; }

        .btn, .nav-cta {
            border: 0; border-radius: 999px; padding: 14px 28px;
            background: linear-gradient(135deg, var(--lilac) 0%, var(--deep) 78%);
            color: var(--white); font-weight: 700; font-size: 14px; letter-spacing: 0.5px;
            box-shadow: 0 10px 24px rgba(100,37,143,.24);
            cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            transition: transform .25s ease, box-shadow .25s ease;
        }
        .btn:hover, .nav-cta:hover { transform: translateY(-2px); box-shadow: 0 14px 28px rgba(100,37,143,.28); }
        .btn-light { background: var(--pale); color: var(--deep); box-shadow: none; }
        .btn-light:hover { background: #f1e6fa; }

        header { position: sticky; top: 0; z-index: 20; background: rgba(255,255,255,.95); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(234,223,243,.6); }
        .nav { height: 80px; display: flex; align-items: center; justify-content: space-between; gap: 30px; }
        
        .brand { display: flex; align-items: center; gap: 12px; font-family: var(--font-heading); font-size: 28px; letter-spacing: 1.5px; color: var(--deep); font-weight: 700; }
        .brand img { width: 54px; height: 54px; object-fit: cover; object-position: center 15%; border-radius: 50%; border: 2px solid var(--gold); padding: 2px; }
        .brand small { display: block; font: 600 10px var(--font-body); letter-spacing: 3px; text-align: left; color: #9270AD; margin-top: -2px; }

        .navlinks { display: flex; align-items: center; gap: 28px; font-size: 13px; font-weight: 600; color: #51495a; }
        .navlinks a { padding: 5px 0; }
        .navlinks a:hover { color: var(--deep); }
        
        .menu { display: none; border: 0; background: var(--pale); border-radius: 12px; padding: 10px; color: var(--deep); font-size: 24px; cursor: pointer; }

        .hero { padding: 0; background: linear-gradient(180deg, #fff, #fbf8fe); }
        .slider { position: relative; min-height: 600px; overflow: hidden; background: var(--deep); color: var(--white); }
        
        .slide { position: absolute; inset: 0; z-index: 0; opacity: 0; visibility: hidden; pointer-events: none; transition: opacity .8s ease, visibility .8s ease; display: flex; align-items: center; background-size: cover; background-position: center; }
        .slide.active { z-index: 1; opacity: 1; visibility: visible; pointer-events: auto; }
        .slide:before { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(34,22,46,.88), rgba(42,27,55,.6) 58%, rgba(42,27,55,.05)); }
        
        .slide-content { position: relative; z-index: 1; max-width: 640px; padding: 80px 5%; }
        .slide .eyebrow { color: var(--gold-light); margin-bottom: 15px; display: block; font-size: 13px; letter-spacing: 2px; text-transform: uppercase; font-weight: 700; }
        .slide h1 { font-family: var(--font-heading); font-size: clamp(48px, 6vw, 72px); line-height: 1.1; margin-bottom: 25px; }
        .slide p { font-size: 18px; color: #f7efff; margin-bottom: 35px; line-height: 1.8; max-width: 540px; }

        .dots { position: absolute; z-index: 5; bottom: 30px; left: 0; right: 0; display: flex; justify-content: center; gap: 10px; }
        .dot { width: 10px; height: 10px; border: 0; border-radius: 50%; background: rgba(255,255,255,.4); padding: 0; cursor: pointer; transition: .3s; }
        .dot.active { width: 30px; border-radius: 999px; background: var(--gold); }

        .status-bar { background: var(--gold-light); color: #59451d; padding: 10px 0; text-align: center; font-size: 14px; font-weight: 600; }
        .status-open { color: #257541; }
        .status-closed { color: #9e2828; }

        .intro { display: grid; grid-template-columns: 1fr 1fr; gap: 60px; align-items: center; padding: 120px 0; }
        .photo-stack { position: relative; min-height: 450px; }
        .photo-stack img { position: absolute; object-fit: cover; border-radius: 24px; box-shadow: var(--shadow); }
        .photo-main { width: 75%; height: 400px; left: 0; top: 0; }
        .photo-small { width: 50%; height: 240px; right: 0; bottom: 0; border: 10px solid var(--white); }

        .services { background: var(--pale); }
        .service-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 30px; }
        .service-card { background: var(--white); border: 1px solid var(--line); border-radius: 24px; padding: 40px; transition: .3s; box-shadow: 0 10px 30px rgba(75,43,102,.03); display: flex; flex-direction: column; }
        .service-card:hover { transform: translateY(-8px); box-shadow: var(--shadow); border-color: var(--gold); }
        .service-icon { width: 56px; height: 56px; border-radius: 18px; background: var(--pale); color: var(--deep); display: grid; place-items: center; font-size: 26px; margin-bottom: 25px; }
        .service-card h3 { font: 600 24px var(--font-heading); margin-bottom: 15px; color: var(--ink); }
        .service-card ul { color: var(--muted); font-size: 15px; line-height: 1.9; margin-bottom: 25px; flex-grow: 1; }
        .service-card li { margin-bottom: 8px; display: flex; justify-content: space-between; gap: 10px; }
        .service-card li span:first-child { font-weight: 500; }
        .service-card li span:last-child { color: var(--deep); font-weight: 600; white-space: nowrap; }

        .gallery-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; grid-auto-rows: 250px; }
        .gallery-item { border-radius: 18px; overflow: hidden; box-shadow: var(--shadow); }
        .gallery-item img { width: 100%; height: 100%; object-fit: cover; transition: transform .5s ease; }
        .gallery-item:hover img { transform: scale(1.05); }
        .gallery-item:nth-child(1) { grid-column: span 2; grid-row: span 2; }
        .gallery-item:nth-child(4) { grid-column: span 2; }

        .testimonials { background: var(--pale); }
        .testi-slider { position: relative; max-width: 800px; margin: 0 auto; padding-bottom: 50px; }
        .testi-slide { text-align: center; opacity: 0; visibility: hidden; position: absolute; inset: 0; transition: .5s ease; }
        .testi-slide.active { opacity: 1; visibility: visible; position: relative; }
        .testi-quote { font: 400 28px/1.6 var(--font-heading); color: var(--deep); margin-bottom: 30px; }
        .testi-stars { color: var(--gold); font-size: 20px; margin-bottom: 15px; }
        .testi-name { font-weight: 700; color: var(--ink); font-size: 16px; }
        .testi-role { color: var(--muted); font-size: 14px; }
        .testi-dots { position: absolute; bottom: 0; left: 0; right: 0; display: flex; justify-content: center; gap: 8px; }

        /* Seção Agendamento com Assistente Virtual IA */
        .booking { background: linear-gradient(135deg, var(--deep) 0%, #8554B1 58%, var(--lilac) 100%); color: var(--white); }
        .booking-wrap { display: grid; grid-template-columns: 1fr 1.25fr; gap: 60px; align-items: center; }
        .booking .section-title, .booking .kicker { color: var(--white); }
        .booking .section-lead { color: #f4eafa; }
        .ai-features { margin-top: 28px; display: grid; gap: 12px; font-size: 15px; color: #f7efff; }
        .ai-features li { display: flex; align-items: center; gap: 10px; }

        .ai-chat-card {
            background: var(--white); color: var(--ink); border-radius: 28px;
            box-shadow: 0 25px 70px rgba(34, 14, 54, .38); overflow: hidden;
            display: flex; flex-direction: column; height: 560px; border: 2px solid rgba(212, 175, 55, .45);
        }
        .ai-chat-header {
            background: linear-gradient(135deg, var(--deep-dark) 0%, var(--deep) 100%);
            color: var(--white); padding: 18px 22px; display: flex; align-items: center; justify-content: space-between;
        }
        .ai-profile { display: flex; align-items: center; gap: 12px; }
        .ai-avatar-wrap { position: relative; width: 46px; height: 46px; }
        .ai-avatar-wrap img { width: 46px; height: 46px; border-radius: 50%; object-fit: cover; object-position: center 15%; border: 2px solid var(--gold); }
        .ai-online-dot { position: absolute; bottom: 1px; right: 1px; width: 12px; height: 12px; background: #25d366; border: 2px solid var(--deep); border-radius: 50%; }
        .ai-profile h3 { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
        .ai-badge { background: var(--gold); color: var(--ink); font-size: 10px; font-weight: 800; padding: 2px 7px; border-radius: 999px; letter-spacing: 0.5px; }
        .ai-profile span { font-size: 12px; color: #e2cef5; display: block; }
        .ai-reset-btn { background: rgba(255,255,255,.14); border: 0; color: var(--white); font-size: 12px; padding: 7px 12px; border-radius: 999px; cursor: pointer; font-weight: 600; }
        .ai-reset-btn:hover { background: rgba(255,255,255,.25); }

        .ai-messages {
            flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px;
            background: #fbf8fe;
        }
        .msg { max-width: 85%; padding: 13px 16px; border-radius: 18px; font-size: 14.5px; line-height: 1.5; animation: fadeInMsg .25s ease; }
        @keyframes fadeInMsg { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        .msg-bot { background: var(--white); color: var(--ink); border: 1px solid var(--line); border-bottom-left-radius: 4px; align-self: flex-start; box-shadow: 0 4px 12px rgba(100,37,143,.05); }
        .msg-user { background: linear-gradient(135deg, var(--deep) 0%, #8342b3 100%); color: var(--white); border-bottom-right-radius: 4px; align-self: flex-end; }
        
        .typing-dots { display: inline-flex; gap: 4px; padding: 4px 2px; }
        .typing-dots span { width: 7px; height: 7px; background: var(--lilac); border-radius: 50%; animation: bounceDot 1.2s infinite ease-in-out; }
        .typing-dots span:nth-child(2) { animation-delay: .2s; }
        .typing-dots span:nth-child(3) { animation-delay: .4s; }
        @keyframes bounceDot { 0%, 80%, 100% { transform: scale(0.6); opacity: .5; } 40% { transform: scale(1); opacity: 1; } }

        .ai-quick-replies {
            padding: 10px 16px; background: var(--white); border-top: 1px solid var(--line);
            display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none;
        }
        .ai-quick-replies::-webkit-scrollbar { display: none; }
        .chip-btn {
            white-space: nowrap; border: 1px solid var(--lilac); background: var(--pale); color: var(--deep);
            padding: 8px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; cursor: pointer; transition: .2s;
        }
        .chip-btn:hover { background: var(--deep); color: var(--white); border-color: var(--deep); }

        .ai-summary-actions { display: grid; gap: 8px; margin-top: 12px; }
        .btn-whats-confirm { background: #25d366; color: #fff; border: 0; padding: 12px 16px; border-radius: 12px; font-weight: 700; font-size: 14px; text-align: center; cursor: pointer; display: block; }
        .btn-whats-confirm:hover { background: #1ebd59; }
        .btn-cal-confirm { background: var(--pale); color: var(--deep); border: 1px solid var(--lilac); padding: 10px 14px; border-radius: 12px; font-weight: 700; font-size: 13px; text-align: center; cursor: pointer; display: block; }
        .btn-cal-confirm:hover { background: #eadbf7; }

        .ai-input-bar { padding: 12px 16px; background: var(--white); border-top: 1px solid var(--line); display: flex; gap: 10px; }
        .ai-input-bar input { flex: 1; border: 1px solid var(--line); border-radius: 999px; padding: 12px 18px; outline: none; font-size: 14px; }
        .ai-input-bar input:focus { border-color: var(--deep); }
        .ai-send-btn { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--deep); color: var(--white); font-size: 18px; cursor: pointer; display: grid; place-items: center; flex-shrink: 0; }
        .ai-send-btn:hover { background: var(--deep-dark); }

        .location { background: var(--white); }
        .location-grid { display: grid; grid-template-columns: 1fr 1.5fr; gap: 60px; align-items: center; }
        .address-card { background: var(--pale); border: 1px solid var(--line); padding: 40px; border-radius: 24px; }
